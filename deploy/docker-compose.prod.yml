services:
  api:
    image: ghcr.io/pivetoo/almanac-api:latest
    container_name: almanac-api
    restart: unless-stopped
    networks: [mainstay-net]
    ports: ["127.0.0.1:8116:8080"]
    volumes:
      - ./config/appsettings.Production.json:/app/appsettings.Production.json:ro

  web:
    image: ghcr.io/pivetoo/almanac-web:latest
    container_name: almanac-web
    restart: unless-stopped
    networks: [mainstay-net]
    ports: ["127.0.0.1:8117:80"]
networks:
  mainstay-net:
    external: true
