name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout almanac
        uses: actions/checkout@v4
        with:
          path: system/almanac

      - name: Checkout archon framework
        uses: actions/checkout@v4
        with:
          repository: pivetoo/archon-framework
          path: frameworks/archon-framework

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Unit tests
        run: >
          dotnet test
          system/almanac/Almanac/Almanac.Testing/Almanac.Testing.csproj
          -c Release

  web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout almanac
        uses: actions/checkout@v4
        with:
          path: system/almanac

      - name: Checkout archon ui
        uses: actions/checkout@v4
        with:
          repository: pivetoo/archon-ui
          path: frameworks/archon-ui

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frameworks/archon-ui/package-lock.json

      - name: Build Archon UI
        run: |
          npm --prefix "frameworks/archon-ui" ci
          npm --prefix "frameworks/archon-ui" run build

      - name: Lint and build web
        working-directory: system/almanac/Almanac/Almanac.Web
        run: |
          npm ci
          npm run lint
          npm run build
